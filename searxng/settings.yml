# SearXNG Settings - Configured for GlobalWatch API access
# See: https://docs.searxng.org/admin/settings/settings.html

use_default_settings: true

server:
  secret_key: "globalwatch-searxng-secret-key-2026"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "all"
  formats:
    - html
    - json  # Enable JSON API output

engines:
  # Enable news engines
  - name: google news
    disabled: false
  - name: bing news
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 30.0
